name: Cone Desktop

# The Cone Desktop release (Slice 29 merge 2, cone-buzz-infra
# slices/29-branded-desktop.md decisions 6–8). A tag cone-desktop-vX.Y.Z on
# `cone` builds the app for Apple silicon and Intel with `just
# cone-desktop-build`, signs it with Cone's Developer ID, notarizes and staples
# the app (Tauri) and the DMG (this file), and publishes both DMGs as a GitHub
# Release on this fork. No updater yet (merge 3).
#
# Every secret is in the environment cone-release: deployments only from
# cone-desktop-v* tags, the owner a required reviewer, so each run waits for
# the owner's approval. workflow_dispatch exists so that the environment's
# refusal of any other ref can be shown (criterion 3).

on:
  push:
    tags:
      - 'cone-desktop-v*'
  workflow_dispatch:

concurrency:
  group: cone-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    environment: cone-release
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            lipo: arm64
            dmg_arch: aarch64
          - target: x86_64-apple-darwin
            lipo: x86_64
            dmg_arch: x64
    env:
      TARGET: ${{ matrix.target }}
      LIPO_ARCH: ${{ matrix.lipo }}
      DMG_ARCH: ${{ matrix.dmg_arch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # The base of the shallowness check comes from block/buzz itself, not from
      # this fork, where a moved tag could hide a deeper diff.
      - name: Fetch the pinned upstream tag from block/buzz
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < cone/UPSTREAM)"
          [[ "$base" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::cone/UPSTREAM holds '$base'"; exit 1; }
          git fetch --no-tags https://github.com/block/buzz.git "+refs/tags/$base:refs/tags/$base"
          echo "upstream $base = $(git rev-parse "$base^{commit}")"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: cone-shallow-check
        run: just cone-shallow-check

      - name: cone-build-env-check
        run: just cone-build-env-check

      - name: Version from the tag, and the tag on cone
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/cone-desktop-v* ]] || { echo "::error::releases build from cone-desktop-v* tags only, not $GITHUB_REF"; exit 1; }
          VERSION="${GITHUB_REF_NAME#cone-desktop-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not SemVer"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/cone || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on cone"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Cone $VERSION from $GITHUB_SHA"

      # A keychain of this run's own, with a password generated here, so the
      # DMG can be re-signed after Tauri: given APPLE_CERTIFICATE, Tauri 2.11
      # imports it into a throwaway keychain per signing step and deletes it.
      - name: Signing keychain and notarization key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/cone-signing.keychain-db"
          P12="$RUNNER_TEMP/cone-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # The user search list, this keychain first; the existing entries are
          # paths without spaces, one per word.
          read -r -a existing <<<"$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "\"$APPLE_SIGNING_IDENTITY\"" \
            || { echo "::error::APPLE_SIGNING_IDENTITY is not a valid identity in APPLE_CERTIFICATE"; exit 1; }
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/cone-notary.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/cone-notary.p8" >> "$GITHUB_ENV"

      # Tauri signs every sidecar and the app with the hardened runtime and
      # upstream's entitlements, notarizes and staples the app, then builds the
      # DMG from it. TAURI_BUNDLER_DMG_IGNORE_CI lets the DMG's Finder layout
      # (cone/'s background) run on the runner, as upstream's release.yml does.
      - name: Build, sign and notarize the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: just cone-desktop-build "$TARGET" "$VERSION"

      - name: Sign, notarize and staple the DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          BUNDLE="desktop/src-tauri/target/$TARGET/release/bundle"
          DMG="$BUNDLE/dmg/Cone_${VERSION}_${DMG_ARCH}.dmg"
          [[ -f "$DMG" ]] || { echo "::error::no $DMG"; ls -l "$BUNDLE/dmg" || true; exit 1; }
          # Upstream's label size (Tauri does not expose it); the patch rewrites
          # the image, so it comes before the DMG's own signature.
          desktop/scripts/set-dmg-finder-text-size.sh "$DMG" 14
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$DMG"
          notary=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          out="$(xcrun notarytool submit "$DMG" "${notary[@]}" --wait --timeout 60m --output-format json)"
          printf '%s\n' "$out"
          id="$(jq -r .id <<<"$out")"
          if [[ "$(jq -r .status <<<"$out")" != Accepted ]]; then
            xcrun notarytool log "$id" "${notary[@]}" || true
            echo "::error::notarization of the DMG: $(jq -r .status <<<"$out")"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          echo "APP=$BUNDLE/macos/Cone.app" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Verify the app and the DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          plist="$APP/Contents/Info.plist"
          for k in CFBundleName CFBundleIdentifier CFBundleShortVersionString; do
            printf '%s = %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$plist")"
          done
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == digital.cone.desktop ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$VERSION" ]]
          codesign --verify --deep --strict -vv "$APP"
          spctl --assess --type execute -vv "$APP"
          xcrun stapler validate "$APP"
          desktop/scripts/verify-macos-entitlements.sh "$APP"
          for bin in "$APP"/Contents/MacOS/*; do
            info="$(codesign -dvv "$bin" 2>&1)"
            grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<<"$info" || { echo "::error::$bin: not signed by the team"; exit 1; }
            grep -q '^CodeDirectory .*flags=.*runtime' <<<"$info" || { echo "::error::$bin: no hardened runtime"; exit 1; }
            archs="$(lipo -archs "$bin")"
            [[ "$archs" == "$LIPO_ARCH" ]] || { echo "::error::$bin: $archs, not $LIPO_ARCH"; exit 1; }
            echo "$(basename "$bin"): team, hardened runtime, $archs"
          done
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          xcrun stapler validate "$DMG"
          shasum -a 256 "$DMG"

      - name: Remove the signing keychain and the notarization key
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/cone-notary.p8" "$RUNNER_TEMP/cone-signing.p12"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cone-desktop-${{ matrix.dmg_arch }}
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/cone-desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cone-desktop-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#cone-desktop-v}"
          UPSTREAM="$(tr -d '[:space:]' < cone/UPSTREAM)"
          ls dist/Cone_"${VERSION}"_aarch64.dmg dist/Cone_"${VERSION}"_x64.dmg
          (cd dist && sha256sum ./*.dmg > SHA256SUMS && cat SHA256SUMS)
          pre=()
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag ${pre[@]+"${pre[@]}"} \
            --title "Cone $VERSION" \
            --notes "Cone Desktop $VERSION, built from block/buzz $UPSTREAM ($GITHUB_SHA). Signed with Cone's Developer ID and notarized by Apple; Apple silicon (aarch64) and Intel (x64). No in-app updates before 1.0."
